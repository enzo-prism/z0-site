name: Z0 support
description: Report a setup or release problem without sharing private game data.
title: "[Support] "
labels: [support]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Z0. This issue will be public.

        **Do not attach worlds, full logs, crash folders, account tokens, email addresses, server addresses, home-folder paths, or unreviewed screenshots.** Run Diagnostics in Z0, open the redacted summary, and share only the smallest relevant excerpt.
  - type: input
    id: version
    attributes:
      label: Z0 version and build
      description: Find this in Z0 → Details.
      placeholder: 0.1.0 (1)
    validations:
      required: true
  - type: dropdown
    id: step
    attributes:
      label: Where did it stop?
      options:
        - Opening Z0
        - Finding Tekkit 2
        - Checking Java or Rosetta
        - Applying Balanced
        - Opening Technic
        - Playing from Technic
        - Restoring a backup
        - Something else
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Keep this short and remove private paths or account information.
    validations:
      required: true
  - type: textarea
    id: redacted
    attributes:
      label: Small redacted diagnostic excerpt
      description: Optional. Review it before pasting. Never attach the complete diagnostic folder.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include a world, full log, token, email, server address, private path, or unreviewed screenshot.
          required: true
